version: "3.8"
services:
  flask:
    image: aerosimcontainerregistry.azurecr.io/ground-station-api:20220420
    domainname: "onetomany"
    environment:
      TZ: "Asia/Hong_Kong"
    ports:
      - "5000:5000"
    networks:
      - default

  mosquitto:
    image: eclipse-mosquitto:1.6.15
    environment:
      TZ: "Asia/Hong_Kong"
    ports:
      - "1883:1883"
    networks:
      - default
networks:
  default: 
